{% extends "base.html" %}

{% block title %}
Upload PDF
{% endblock %}

{% block content %}

<div class="container mt-5">

    <h2>Upload PDF</h2>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn btn-primary">
            Upload
        </button>

    </form>

</div>

{% endblock %}
